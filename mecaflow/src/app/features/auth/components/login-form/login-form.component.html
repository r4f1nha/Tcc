@if (errorMessage()) {
  <div class="mb-6 p-3 rounded-lg bg-red-500/10 border border-red-500/30 flex items-start gap-3">
    <svg class="w-5 h-5 text-red-400 mt-0.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
    </svg>
    <p class="text-sm text-red-400">{{ errorMessage() }}</p>
  </div>
}

<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5" novalidate>
  <!-- Email -->
  <div>
    <label for="email" class="block text-sm font-medium text-slate-300 mb-1.5">E-mail</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      placeholder="seu@email.com"
      autocomplete="email"
      class="w-full px-4 py-3 bg-[#1a1d27] border rounded-lg text-white text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-[#4F6EF7]/50 focus:border-[#4F6EF7] transition-all"
      [class.border-red-500]="emailInvalid"
      [class.border-slate-600\/50]="!emailInvalid"
    />
    @if (emailInvalid) {
      <p class="mt-1 text-xs text-red-400">{{ emailErrorMessage }}</p>
    }
  </div>

  <!-- Password -->
  <div>
    <label for="password" class="block text-sm font-medium text-slate-300 mb-1.5">Senha</label>
    <div class="relative">
      <input
        id="password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        placeholder="Digite sua senha"
        autocomplete="current-password"
        class="w-full px-4 py-3 pr-12 bg-[#1a1d27] border rounded-lg text-white text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-[#4F6EF7]/50 focus:border-[#4F6EF7] transition-all"
        [class.border-red-500]="passwordInvalid"
        [class.border-slate-600\/50]="!passwordInvalid"
      />
      <button
        type="button"
        (click)="togglePasswordVisibility()"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-300 transition-colors">
        @if (showPassword()) {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"/>
          </svg>
        } @else {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
        }
      </button>
    </div>
    @if (passwordInvalid) {
      <p class="mt-1 text-xs text-red-400">{{ passwordErrorMessage }}</p>
    }
  </div>

  <!-- Remember + Forgot -->
  <div class="flex items-center justify-between">
    <label class="flex items-center gap-2 cursor-pointer">
      <input type="checkbox" formControlName="rememberMe"
        class="w-4 h-4 rounded border-slate-600 text-[#4F6EF7] bg-[#1a1d27]" />
      <span class="text-sm text-slate-400">Lembrar-me</span>
    </label>
    <button type="button" (click)="onForgotPassword()"
      class="text-sm font-medium text-[#4F6EF7] hover:text-[#3d5ae0] transition-colors">
      Esqueceu a senha?
    </button>
  </div>

  <!-- Submit -->
  <button type="submit" [disabled]="loading()"
    class="w-full py-3 bg-[#4F6EF7] hover:bg-[#3d5ae0] text-white font-semibold rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 shadow-lg shadow-[#4F6EF7]/25">
    @if (loading()) {
      <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
      </svg>
      Entrando...
    } @else {
      Entrar
    }
  </button>
</form>
