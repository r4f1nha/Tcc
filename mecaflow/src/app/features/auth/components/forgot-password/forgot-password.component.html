<div class="w-full max-w-md mx-auto">
  <!-- Logo & Branding -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-[#4F6EF7]/10 mb-6">
      <svg class="w-9 h-9 text-[#4F6EF7]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
      </svg>
    </div>
    <h1 class="text-3xl font-bold text-slate-900 dark:text-white tracking-tight">
      Reset Password
    </h1>
    <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">
      Enter your email and we'll send you a recovery link
    </p>
  </div>

  <!-- Card -->
  <div class="bg-white dark:bg-[#22263a] rounded-2xl shadow-xl dark:shadow-2xl dark:shadow-black/20 border border-slate-200 dark:border-slate-700/50 p-8">
    <!-- Success Message -->
    @if (successMessage()) {
      <div class="mb-6 p-4 rounded-xl bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800/50 flex items-start gap-3">
        <svg class="w-5 h-5 text-emerald-500 dark:text-emerald-400 mt-0.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <p class="text-sm text-emerald-700 dark:text-emerald-300">{{ successMessage() }}</p>
      </div>
    }

    <!-- Error Message -->
    @if (errorMessage()) {
      <div class="mb-6 p-4 rounded-xl bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800/50 flex items-start gap-3">
        <svg class="w-5 h-5 text-red-500 dark:text-red-400 mt-0.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
        </svg>
        <p class="text-sm text-red-700 dark:text-red-300">{{ errorMessage() }}</p>
      </div>
    }

    @if (!successMessage()) {
      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="space-y-5" novalidate>
        <!-- Email Field -->
        <div>
          <label for="reset-email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">
            Email address
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-slate-400 dark:text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
              </svg>
            </div>
            <input
              id="reset-email"
              type="email"
              formControlName="email"
              placeholder="you@company.com"
              autocomplete="email"
              [class]="emailInvalid
                ? 'block w-full pl-11 pr-4 py-3 rounded-xl border-2 border-red-400 dark:border-red-500 bg-white dark:bg-[#1a1d27] text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-red-400/50 text-sm transition-all duration-200'
                : 'block w-full pl-11 pr-4 py-3 rounded-xl border-2 border-slate-200 dark:border-slate-600 bg-white dark:bg-[#1a1d27] text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-[#4F6EF7] focus:ring-2 focus:ring-[#4F6EF7]/20 text-sm transition-all duration-200'"
            />
          </div>
          @if (emailInvalid) {
            <p class="mt-1.5 text-xs text-red-500 dark:text-red-400">{{ emailErrorMessage }}</p>
          }
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="loading()"
          class="relative w-full flex items-center justify-center py-3 px-4 rounded-xl text-sm font-semibold text-white bg-[#4F6EF7] hover:bg-[#3b5ae0] focus:outline-none focus:ring-2 focus:ring-[#4F6EF7]/50 focus:ring-offset-2 dark:focus:ring-offset-[#22263a] disabled:opacity-60 disabled:cursor-not-allowed transition-all duration-200 shadow-lg shadow-[#4F6EF7]/25"
        >
          @if (loading()) {
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Sending link...
          } @else {
            Send recovery link
          }
        </button>
      </form>
    }

    <!-- Back to Login -->
    <div class="mt-6 text-center">
      <button
        type="button"
        (click)="onBackToLogin()"
        class="inline-flex items-center gap-1.5 text-sm font-medium text-[#4F6EF7] hover:text-[#3b5ae0] dark:text-[#6d8aff] dark:hover:text-[#8da2ff] transition-colors"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
        Back to sign in
      </button>
    </div>
  </div>

  <!-- Footer -->
  <p class="mt-8 text-center text-xs text-slate-400 dark:text-slate-500">
    &copy; 2026 MecaFlow. All rights reserved.
  </p>
</div>
