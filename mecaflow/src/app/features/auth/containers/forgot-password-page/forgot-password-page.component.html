<div class="min-h-screen flex items-center justify-center bg-[#f8fafc] dark:bg-[#0f1117] transition-colors duration-300 px-4 py-12">
  <!-- Background decoration -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
    <div class="absolute -top-40 -right-40 w-80 h-80 rounded-full bg-[#4F6EF7]/5 dark:bg-[#4F6EF7]/10 blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-80 h-80 rounded-full bg-[#4F6EF7]/5 dark:bg-[#4F6EF7]/10 blur-3xl"></div>
  </div>

  <!-- Content -->
  <div class="relative z-10 w-full">
    <app-forgot-password-form
      [loading]="loading()"
      [successMessage]="successMessage()"
      [errorMessage]="errorMessage()"
      (submitReset)="onSubmitReset($event)"
      (navigateToLogin)="onNavigateToLogin()"
    />
  </div>
</div>
