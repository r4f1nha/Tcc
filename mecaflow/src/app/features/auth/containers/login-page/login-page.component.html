<!--Login Page Starts-->
<section id="login">
  <div class="row auth-height m-0">
    <div class="col-12 d-flex align-items-center justify-content-center">
      <div class="card overflow-hidden" style="min-width: 360px; max-width: 420px; width: 100%;">
        <div class="card-content">
          <div class="card-body p-4">

            <!-- Logo e título -->
            <div class="text-center mb-4">
              <div class="d-inline-flex align-items-center justify-content-center mb-3"
                style="width:60px;height:60px;background:linear-gradient(135deg,#4F6EF7,#7b5ea7);border-radius:14px;">
                <i class="fas fa-cog text-white" style="font-size:26px;"></i>
              </div>
              <h4 class="mb-1 font-weight-700" style="color:#1a1d27;">MecaFlow</h4>
              <p class="text-muted" style="font-size:0.8rem;">SISTEMA DE GESTÃO PARA OFICINAS MECÂNICAS</p>
              <hr class="my-3">
              <p style="font-size:0.85rem; color:#666;">Por favor, efetue o login.</p>
            </div>

            <!-- Erro -->
            @if (errorMessage()) {
              <div class="alert alert-danger d-flex align-items-center mb-3" role="alert">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <small>{{ errorMessage() }}</small>
              </div>
            }

            <!-- Formulário -->
            <app-login-form
              [loading]="loading()"
              [errorMessage]="errorMessage()"
              (submitLogin)="onLogin($event)"
              (navigateToForgotPassword)="onNavigateToForgotPassword()"
            />

            <!-- Dev Mode -->
            @if (devMode) {
              <div class="mt-3 p-3 rounded border border-warning" style="background:#fff9e6;">
                <p class="text-warning font-weight-600 mb-2" style="font-size:0.75rem;">
                  <i class="fas fa-flask mr-1"></i> DEV MODE
                </p>
                <button type="button" class="btn btn-warning btn-block btn-sm" (click)="onDevLogin()">
                  Entrar sem backend
                </button>
              </div>
            }

          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<!--Login Page Ends-->
