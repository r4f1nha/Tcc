<div class="min-h-screen flex items-center justify-center bg-[#0f1117] px-4">
  <div class="w-full max-w-md">
    <!-- Branding -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-[#4F6EF7]/10 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-[#4F6EF7]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white">
        <span class="text-[#4F6EF7]">Meca</span>Flow
      </h1>
      <p class="text-slate-400 text-sm mt-2">Entre na sua conta para continuar</p>
    </div>

    <!-- Card -->
    <div class="bg-[#22263a] rounded-2xl p-8 shadow-xl border border-slate-700/50">
      <app-login-form
        [loading]="loading()"
        [errorMessage]="errorMessage()"
        (submitLogin)="onLogin($event)"
        (navigateToForgotPassword)="onNavigateToForgotPassword()"
      />
    </div>

    <p class="text-center text-xs text-slate-600 mt-6">&copy; 2026 MecaFlow. Todos os direitos reservados.</p>
  </div>
</div>
