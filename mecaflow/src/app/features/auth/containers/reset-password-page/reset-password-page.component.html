<div class="min-h-screen bg-[#0f1117] flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <!-- Branding -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white mb-2">
        <span class="text-[#4F6EF7]">Meca</span>Flow
      </h1>
      <p class="text-slate-400 text-sm">Defina sua nova senha</p>
    </div>

    <!-- Card -->
    <div class="bg-[#22263a] rounded-2xl p-8 shadow-xl border border-slate-700/50">
      <app-reset-password-form
        [loading]="loading()"
        [errorMessage]="error()"
        [successMessage]="resetSuccess() ? 'Você já pode acessar sua conta com a nova senha.' : null"
        [tokenValid]="tokenValid()"
        (submitResetPassword)="onResetPassword($event)"
        (navigateToLogin)="onNavigateToLogin()"
      />
    </div>
  </div>
</div>
