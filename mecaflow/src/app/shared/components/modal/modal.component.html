@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4"
    role="dialog"
    aria-modal="true"
  >
    <!-- Overlay -->
    <div
      class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity"
      (click)="onOverlayClick()"
    ></div>

    <!-- Dialog -->
    <div
      [class]="sizeClasses + ' relative w-full bg-white dark:bg-[#22263a] rounded-xl shadow-2xl ring-1 ring-slate-200 dark:ring-slate-700 transform transition-all'"
      (click)="onDialogClick($event)"
    >
      <!-- Header -->
      @if (title()) {
        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-700">
          <h2 class="text-lg font-semibold text-slate-900 dark:text-white">
            {{ title() }}
          </h2>
          <button
            type="button"
            class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
            (click)="onClose()"
            aria-label="Fechar"
          >
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      }

      <!-- Body -->
      <div class="px-6 py-4">
        <ng-content />
      </div>

      <!-- Footer -->
      <div class="px-6 py-4 border-t border-slate-200 dark:border-slate-700">
        <ng-content select="[modal-footer]" />
      </div>
    </div>
  </div>
}
