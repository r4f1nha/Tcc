# Redis habilitado em producao (mesmo servidor EasyPanel)
spring.autoconfigure.exclude=

spring.data.redis.url=redis://default:c875c4dcf056a7f60c08@cloudy_evolution-api-redis:6379

# Em producao cria tabelas novas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Sem debug de seguranca em producao
logging.level.org.springframework.security=WARN

# JWT fixo para producao (nao depende de env var do EasyPanel)
jwt.secret=mecaflow-tcc-secret-key-must-be-at-least-256-bits-long-for-hs256
